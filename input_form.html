<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dish Planner - Litos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <img src="logo.jpg" alt="LISTI Logo" class="logo">
        <h1>L - I - S - T - I</h1>
        <p>ניהול רשימות הקניות שלך</p>
    </div>

    <div class="navbar">
        <a href="/signup">Sign Up</a>
        <a href="/login">Login</a>
        {% if current_user %}
            <a href="/dashboard">Dashboard</a>
            <a href="/create_new_list">Create New List</a>
        {% endif %}
    </div>

    <div class="container input-form-container">
        <h2>Dish Planner</h2>
        <form onsubmit="submitForm(); return false;">
            <label for="budget">Enter the maximum budget:</label>
            <input type="number" id="budget" name="budget" required>

            <label for="requiredDish">Enter dishes that must be included (comma-separated, optional):</label>
            <input type="text" id="requiredDish" name="requiredDish">

            <label for="allergies">Enter allergies (comma-separated, optional):</label>
            <input type="text" id="allergies" name="allergies">

            <input type="submit" value="Submit" class="form-button">
        </form>

        <div id="results" class="results"></div>
    </div>

    <div class="images">
         <img src="Super1.jpg" alt="Supermarket Image 1">
        <img src="Super2.jpg" alt="Supermarket Image 2">
        <img src="Super3.jpg" alt="Supermarket Image 3">
    </div>

    <script>
        function submitForm() {
            var budget = document.getElementById("budget").value;
            var requiredDish = document.getElementById("requiredDish").value;
            var allergies = document.getElementById("allergies").value;

            var xhr = new XMLHttpRequest();
            xhr.open("POST", "/process", true);
            xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        document.getElementById("results").innerHTML = xhr.responseText;
                    } else {
                        document.getElementById("results").innerHTML = `<p>Error: ${xhr.responseText}</p>`;
                    }
                }
            };
            xhr.send(JSON.stringify({
                budget: budget,
                requiredDish: requiredDish,
                allergies: allergies
            }));
        }
    </script>
</body>
</html>
